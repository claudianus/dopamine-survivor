<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>도파민 서바이버 - 프로시듀럴 맵 서바이벌</title>
<meta name="description" content="무한 프로시듀럴 맵에서 벌어지는 도파민 폭발 서바이벌! 레벨업, 무기 수집, 보물 상자, 보스전!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💎</text></svg>">
<link rel="stylesheet" href="style.css?v=106">
</head>
<body>

<canvas id="game"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="xpbar">
    <div id="xpfill"></div>
    <div id="lvbadge">LV 1</div>
  </div>

  <div id="topbar">
    <div id="timer">00:00</div>
    <div id="topstats">
      <span id="kills">💀 0</span>
      <span id="gemcount">💎 0</span>
    </div>
  </div>

  <div id="seedTag"></div>

  <div id="bossbar" class="hidden">
    <div id="bossname">보스</div>
    <div id="bosstrack"><div id="bossfill"></div></div>
  </div>

  <canvas id="minimap"></canvas>

  <div id="bottombar">
    <div id="weaponBar"></div>
    <div id="ragebar">
      <div id="ragefill"></div>
      <span id="ragetext">⚡ 도파민 러시</span>
    </div>
    <div id="hpbar">
      <div id="hpfill"></div>
      <span id="hptext">100 / 100</span>
    </div>
    <div id="passiveBar"></div>
  </div>

  <div id="combo"></div>
  <div id="banner"></div>
</div>

<button id="muteBtn" class="iconbtn" title="소리 켜기/끄기">🔊</button>
<button id="pauseBtn" class="iconbtn hidden" title="일시정지 (ESC)">⏸️</button>
<button id="rageBtn" title="도파민 러시! (SPACE)">⚡</button>

<div id="rushfx"></div>

<div id="joystick"><div></div></div>

<!-- ============ 타이틀 ============ -->
<div id="overlay-title" class="overlay">
  <div class="panel title-panel">
    <div class="logo">
      <span class="logo-dopa">도파민</span> <span class="logo-surv">서바이버</span>
    </div>
    <div class="tagline">무한 프로시듀럴 월드 · 20분 생존 · 도파민 폭발</div>

    <div class="seed-row">
      <input id="seedInput" placeholder="시드 (비우면 랜덤)" maxlength="20" autocomplete="off">
      <button id="btn-random-seed" class="btn small">🎲</button>
    </div>

    <button id="btn-start" class="btn start">▶ 게임 시작</button>

    <div class="howto">
      <div><b>이동</b> WASD / 방향키 / 터치 드래그 &nbsp;·&nbsp; <b>줌</b> 마우스 휠</div>
      <div><b>공격</b> 자동 &nbsp;·&nbsp; <b>도파민 러시</b> SPACE (게이지 최대 시)</div>
      <div><b>목표</b> 무기를 만렙 찍어 <b class="pink">진화</b>시키고, 20분 뒤 오는 최종 보스를 사냥하라</div>
    </div>
    <div id="bestScore" class="best"></div>
  </div>
</div>

<!-- ============ 레벨업 ============ -->
<div id="overlay-levelup" class="overlay hidden">
  <div class="panel lu-panel">
    <div class="lu-head">⚡ 레벨 업! ⚡</div>
    <div class="lu-sub">강화를 선택하세요 (1~3 키 또는 클릭)</div>
    <div id="lu-cards"></div>
  </div>
</div>

<!-- ============ 보물 상자 ============ -->
<div id="overlay-chest" class="overlay hidden">
  <div class="panel ch-panel">
    <div id="ch-title">💎 보물 상자!</div>
    <div class="ch-sub">행운의 강화가 결정되는 중...</div>
    <div id="ch-slots"></div>
    <div id="ch-result"></div>
    <button id="ch-done" class="btn hidden">획득 완료!</button>
  </div>
</div>

<!-- ============ 일시정지 ============ -->
<div id="overlay-pause" class="overlay hidden">
  <div class="panel">
    <div class="ov-title">⏸️ 일시정지</div>
    <button id="btn-resume" class="btn">계속하기</button>
    <button id="btn-quit" class="btn danger">메인으로</button>
  </div>
</div>

<!-- ============ 게임 오버 / 승리 ============ -->
<div id="overlay-end" class="overlay hidden">
  <div class="panel end-panel">
    <div id="end-title">게임 오버</div>
    <div id="end-sub"></div>
    <div id="end-stats"></div>
    <button id="btn-retry" class="btn start">🔄 다시 도전</button>
    <button id="btn-menu" class="btn">메인으로</button>
  </div>
</div>

<script src="js/core.js?v=106"></script>
<script src="js/audio.js?v=106"></script>
<script src="js/map.js?v=106"></script>
<script src="js/entities.js?v=106"></script>
<script src="js/weapons.js?v=106"></script>
<script src="js/upgrades.js?v=106"></script>
<script src="js/game.js?v=106"></script>
</body>
</html>
